services:
  postgres:
    image: postgres:16-alpine
    container_name: chats-postgres
    environment:
      POSTGRES_DB: chats
      POSTGRES_USER: chats
      POSTGRES_PASSWORD: chats
    ports:
      - "5432:5432"
    volumes:
      - chats_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chats -d chats"]
      interval: 5s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: sockets-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - sockets_cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sockets-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chats:
    build:
      context: .
      dockerfile: chats/Dockerfile
    container_name: chats-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chats
      SPRING_DATASOURCE_USERNAME: chats
    depends_on:
      postgres:
        condition: service_healthy

  sockets:
    build:
      context: .
      dockerfile: sockets/Dockerfile
    container_name: sockets-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      APP_CHATS_BASE_URL: http://chats:8080
    depends_on:
      cassandra:
        condition: service_healthy
      redis:
        condition: service_healthy
      chats:
        condition: service_started

volumes:
  chats_pg_data:
  sockets_cassandra_data:
